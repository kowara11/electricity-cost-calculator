<body>
<header>
  <div class="header-inner">⚡ 電気代かんたん計算</div>
</header>

<section class="hero">
  <h1>電気代を計算・比較・節約！</h1>
  <p>毎月の電気代から年間の支出まで簡単シミュレーション</p>
</section>

<main>

<section class="card">
<h2>⚡ 電気料金を入力</h2>

<div class="field">
<label for="basic">基本料金</label>
<div class="input-wrap">
<input id="basic" type="number" value="1000" min="0" step="any">
<span class="unit">円</span>
</div>
</div>

<div class="field">
<label for="usage">今月の電気使用量</label>
<div class="input-wrap">
<input id="usage" type="number" value="300" min="0" step="any">
<span class="unit">kWh</span>
</div>
</div>

<div class="field">
<label for="price">電力量料金単価</label>
<div class="input-wrap">
<input id="price" type="number" value="31" min="0" step="any">
<span class="unit">円/kWh</span>
</div>
</div>

<div class="field">
<label for="fuel">燃料費調整単価</label>
<div class="input-wrap">
<input id="fuel" type="number" value="0" step="any">
<span class="unit">円/kWh</span>
</div>
<div class="hint">マイナスの数値も入力できます。</div>
</div>

<div class="field">
<label for="renewable">再エネ賦課金単価</label>
<div class="input-wrap">
<input id="renewable" type="number" value="0" min="0" step="any">
<span class="unit">円/kWh</span>
</div>
</div>

<div class="field">
<label for="previous">前月の電気使用量（任意）</label>
<div class="input-wrap">
<input id="previous" type="number" placeholder="例：280" min="0" step="any">
<span class="unit">kWh</span>
</div>
<div class="hint">前月との比較をする場合に入力してください。</div>
</div>

<button type="button" onclick="calculate()">電気代を計算する</button>
<div id="error" class="error" role="alert" hidden></div>

<div class="result" aria-live="polite">
<div class="result-title">今月の電気代の目安</div>
<div class="amount" id="total">10,600円</div>
<div class="sub-amount">1か月の概算料金</div>

<div class="breakdown">
<div class="breakdown-row">
<span>基本料金</span><span id="basicResult">1,000円</span>
</div>
<div class="breakdown-row">
<span>電力量料金</span><span id="energyResult">9,300円</span>
</div>
<div class="breakdown-row">
<span>燃料費調整額</span><span id="fuelResult">0円</span>
</div>
<div class="breakdown-row">
<span>再エネ賦課金</span><span id="renewableResult">0円</span>
</div>
<div class="breakdown-row total-row">
<span>合計</span><span id="sumResult">10,300円</span>
</div>
</div>
</div>

<section class="card">
<h2>📅 年間電気代シミュレーション</h2>
<p>今月と同じ使用量・料金が12か月続いた場合の目安です。</p>
<div class="panel">
<div class="compare-label">年間の予想電気代</div>
<div class="big-number" id="yearly">123,600円</div>
<div class="compare-label">月額の目安 × 12か月</div>
</div>
</section>

<section class="card">
<h2>📊 前月との比較</h2>
<div id="comparisonMessage">前月の使用量を入力すると比較できます。</div>
<div class="comparison">
<div class="compare-box">
<div class="compare-label">前月の使用量</div>
<div class="compare-value" id="previousDisplay">未入力</div>
</div>
<div class="compare-box">
<div class="compare-label">今月の使用量</div>
<div class="compare-value" id="currentDisplay">300kWh</div>
</div>
<div class="compare-box">
<div class="compare-label">使用量の増減</div>
<div class="compare-value" id="usageDifference">--</div>
</div>
<div class="compare-box">
<div class="compare-label">電気代の増減</div>
<div class="compare-value" id="costDifference">--</div>
</div>
</div>
<div class="hint">前月と今月に同じ料金単価・基本料金を適用した概算比較です。</div>
</section>

<section class="card">
<h2>💡 節約アドバイス</h2>
<div class="advice">
<h3 id="adviceTitle">電気代を上手に管理しよう</h3>
<p id="adviceText">使用量を入力して計算すると、節約のヒントが表示されます。</p>
</div>
</section>

<section class="card">
<h2>ご利用上の注意</h2>
<div class="info">
このツールは入力された基本料金と各単価を用いた概算です。年間予測は今月と同じ使用量・料金が続くと仮定しています。前月比較も同じ料金条件で計算するため、実際の請求額とは異なる場合があります。税金、各種割引、その他の調整額などは含まれていません。
</div>
</section>

</main>

<footer>
電気代かんたん計算｜無料シミュレーター
</footer>

<script>
function money(n) {
  return Math.round(n).toLocaleString("ja-JP") + "円";
}

function calculate() {
  const ids = ["basic","usage","price","fuel","renewable"];
  const values = {};

  for (const id of ids) {
    const text = document.getElementById(id).value.trim();
    const number = Number(text);

    if (text === "" || !Number.isFinite(number)) {
      showError("料金と使用量の項目を正しく入力してください。");
      return;
    }
    values[id] = number;
  }

  if (values.basic < 0 || values.usage < 0 ||
      values.price < 0 || values.renewable < 0) {
    showError("基本料金、使用量、電力量料金、再エネ賦課金は0以上で入力してください。");
    return;
  }

  const previousText = document.getElementById("previous").value.trim();
  let previous = null;

  if (previousText !== "") {
    previous = Number(previousText);
    if (!Number.isFinite(previous) || previous < 0) {
      showError("前月の使用量は0以上の数値で入力してください。");
      return;
    }
  }

  const basic = values.basic;
  const usage = values.usage;
  const energy = usage * values.price;
  const fuel = usage * values.fuel;
  const renewable = usage * values.renewable;
  const total = basic + energy + fuel + renewable;

  if (![energy, fuel, renewable, total].every(Number.isFinite)) {
    showError("入力値が大きすぎます。数値を確認してください。");
    return;
  }

  document.getElementById("error").hidden = true;

  document.getElementById("basicResult").textContent = money(basic);
  document.getElementById("energyResult").textContent = money(energy);
  document.getElementById("fuelResult").textContent = money(fuel);
  document.getElementById("renewableResult").textContent = money(renewable);
  document.getElementById("total").textContent = money(total);
  document.getElementById("sumResult").textContent = money(total);

  document.getElementById("yearly").textContent = money(total * 12);
  document.getElementById("currentDisplay").textContent = usage + "kWh";

  updateComparison(previous, usage, total, values);
  updateAdvice(previous, usage);
}

function updateComparison(previous, usage, total, values) {
  const message = document.getElementById("comparisonMessage");

  if (previous === null) {
    document.getElementById("previousDisplay").textContent = "未入力";
    document.getElementById("usageDifference").textContent = "--";
    document.getElementById("costDifference").textContent = "--";
    message.textContent = "前月の使用量を入力すると比較できます。";
    return;
  }

  const difference = usage - previous;
  const rate = previous === 0
    ? null
    : difference / previous * 100;

  const previousCost =
    values.basic + previous * (
      values.price + values.fuel + values.renewable
    );

  const costDifference = total - previousCost;

  document.getElementById("previousDisplay").textContent = previous + "kWh";
  document.getElementById("usageDifference").textContent =
    (difference > 0 ? "+" : "") + difference.toLocaleString("ja-JP") + "kWh";
  document.getElementById("costDifference").textContent =
    (costDifference > 0 ? "+" : "") + money(costDifference);

  if (difference > 0) {
    message.textContent = "前月より使用量が増えています。" +
      (rate === null ? "" : " 増加率は約" + rate.toFixed(1) + "%です。");
  } else if (difference < 0) {
    message.textContent = "前月より使用量が減っています。" +
      (rate === null ? "" : " 減少率は約" + Math.abs(rate).toFixed(1) + "%です。");
  } else {
    message.textContent = "前月と今月の使用量は同じです。";
  }
}

function updateAdvice(previous, usage) {
  const title = document.getElementById("adviceTitle");
  const text = document.getElementById("adviceText");

  if (previous === null) {
    title.textContent = "まずは使用量をチェック！";
    text.textContent =
      "前月の使用量も入力すると、増減を確認できます。エアコンの設定温度、照明、待機電力などを見直すことも節約につながります。";
  } else if (usage > previous) {
    title.textContent = "使用量が増えています";
    text.textContent =
      "エアコンや暖房器具の使用時間、給湯器、家電の使い方などを確認してみましょう。気温や在宅時間、家族構成の変化も増加の理由になります。";
  } else if (usage < previous) {
    title.textContent = "使用量が減っています！";
    text.textContent =
      "良い変化です。無理のない範囲で、照明をこまめに消すことや、使わない家電の電源を切る習慣を続けてみましょう。";
  } else {
    title.textContent = "使用量を維持できています";
    text.textContent =
      "前月と同じ使用量です。エアコンのフィルター掃除や冷蔵庫の設定、照明の使い方などを見直してみましょう。";
  }
}

function showError(message) {
  const error = document.getElementById("error");
  error.textContent = message;
  error.hidden = false;
}
</script>

<section class="card">
  <h2>電気代の計算方法を分かりやすく解説</h2>

  <p>
    電気代は、基本料金と電力量料金、
    燃料費調整額、再生可能エネルギー発電促進賦課金
    などを合計して計算されます。
    このサイトでは、毎月の電気使用量や料金単価を入力するだけで、
    電気代の目安を簡単にシミュレーションできます。
  </p>

  <h3>電気代の計算式</h3>
  <p>
    電気代は、基本料金に電力量料金、
    燃料費調整額、再エネ賦課金を加えて計算します。
  </p>

  <h3>基本料金とは？</h3>
  <p>
    基本料金は、電気の使用量にかかわらず、
    契約内容に応じて毎月発生する料金です。
  </p>

  <h3>電力量料金とは？</h3>
  <p>
    電力量料金は、実際に使用した電気の量に
    電力量料金単価を掛けて計算する料金です。
  </p>

  <h3>燃料費調整額とは？</h3>
  <p>
    燃料費調整額は、発電に必要な燃料価格の変動を
    電気料金に反映するための費用です。
  </p>

  <h3>再エネ賦課金とは？</h3>
  <p>
    再エネ賦課金は、再生可能エネルギーの普及を
    支えるために電気の使用量に応じて負担する料金です。
  </p>

  <h3>電気代を節約するポイント</h3>
  <ul>
    <li>エアコンの設定温度や使用時間を見直す</li>
    <li>使っていない家電の電源を切る</li>
    <li>照明を省エネ性能の高いものにする</li>
    <li>電気料金プランを比較する</li>
  </ul>

  <p>
    電気代を見直す第一歩は、
    毎月の電気使用量と料金を把握することです。
    ぜひ当サイトの無料電気代シミュレーターを活用してください。
  </p>
</section>
