
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="基本料金、電力量料金、燃料費調整額、再エネ賦課金から電気代を計算できる無料ツールです。">
<title>電気代かんたん計算｜無料シミュレーター</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: sans-serif;
  color: #183153;
  background: #f2f7fc;
  line-height: 1.7;
}
header {
  background: white;
  padding: 16px 20px;
  border-bottom: 1px solid #e5edf5;
}
.header-inner {
  max-width: 850px;
  margin: auto;
  font-size: 21px;
  font-weight: bold;
  color: #1557a5;
}
.hero {
  text-align: center;
  padding: 35px 15px;
  background: linear-gradient(135deg,#dceeff,#f4f9ff);
}
.hero h1 { font-size: 30px; margin: 0 0 8px; }
.hero p { color: #526b86; margin: 0; }

main {
  max-width: 750px;
  margin: 25px auto 50px;
  padding: 0 15px;
}
.card {
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 5px 22px rgba(35,75,120,.08);
}
h2 { font-size: 21px; margin-top: 0; }
.field { margin-bottom: 19px; }
label { display: block; font-weight: bold; margin-bottom: 7px; }
.input-wrap { display: flex; align-items: center; gap: 10px; }
input {
  width: 100%;
  min-width: 0;
  padding: 13px;
  font-size: 18px;
  border: 1px solid #cbd8e6;
  border-radius: 9px;
}
input:focus {
  outline: 3px solid #cce3ff;
  border-color: #2878d0;
}
.unit { white-space: nowrap; font-weight: bold; }
.hint { font-size: 12px; color: #74849a; margin-top: 5px; }

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #1767c2;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}
button:hover { background: #1055a5; }

.result {
  margin-top: 24px;
  padding: 23px 15px;
  background: #edf5ff;
  border: 1px solid #d5e8ff;
  border-radius: 13px;
  text-align: center;
}
.result-title { font-weight: bold; color: #45627f; }
.amount {
  font-size: 40px;
  font-weight: 800;
  color: #1261b9;
  overflow-wrap: anywhere;
}
.breakdown {
  margin-top: 20px;
  border-top: 1px solid #dce7f3;
  padding-top: 12px;
  text-align: left;
}
.breakdown-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid #e7eef6;
}
.breakdown-row span:last-child {
  font-weight: bold;
  white-space: nowrap;
}
.total-row {
  font-size: 18px;
  color: #1259a5;
  font-weight: bold;
}
.error {
  color: #c52c2c;
  background: #fff0f0;
  padding: 10px;
  border-radius: 8px;
  margin-top: 12px;
}
.info {
  margin-top: 20px;
  padding: 15px;
  background: #f8fafc;
  border-radius: 10px;
  font-size: 13px;
  color: #64748b;
}
footer {
  text-align: center;
  padding: 25px;
  color: #8290a0;
  font-size: 12px;
}
@media(max-width:480px) {
  .card { padding: 19px 15px; }
  .hero h1 { font-size: 25px; }
  .amount { font-size: 34px; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">⚡ 電気代かんたん計算</div>
</header>

<section class="hero">
  <h1>毎月の電気代を計算！</h1>
  <p>電気料金の内訳まで簡単シミュレーション</p>
</section>

<main>
<section class="card">
<h2>⚡ 電気料金を入力</h2>

<div class="field">
<label for="basic">基本料金</label>
<div class="input-wrap">
<input id="basic" type="number" value="0" min="0" step="any">
<span class="unit">円</span>
</div>
</div>

<div class="field">
<label for="usage">1か月の電気使用量</label>
<div class="input-wrap">
<input id="usage" type="number" value="300" min="0" step="any">
<span class="unit">kWh</span>
</div>
</div>

<div class="field">
<label for="price">電力量料金単価</label>
<div class="input-wrap">
<input id="price" type="number" value="31" min="0" step="any">
<span class="unit">円/kWh</span>
</div>
</div>

<div class="field">
<label for="fuel">燃料費調整単価</label>
<div class="input-wrap">
<input id="fuel" type="number" value="0" step="any">
<span class="unit">円/kWh</span>
</div>
<div class="hint">マイナスの数値も入力できます。</div>
</div>

<div class="field">
<label for="renewable">再エネ賦課金単価</label>
<div class="input-wrap">
<input id="renewable" type="number" value="0" min="0" step="any">
<span class="unit">円/kWh</span>
</div>
</div>

<button type="button" onclick="calculate()">
電気代を計算する
</button>

<div id="error" class="error" role="alert" hidden></div>

<div class="result" aria-live="polite">
<div class="result-title">1か月の電気代の目安</div>
<div class="amount" id="total">9,300円</div>

<div class="breakdown">
<div class="breakdown-row">
<span>基本料金</span>
<span id="basicResult">0円</span>
</div>
<div class="breakdown-row">
<span>電力量料金</span>
<span id="energyResult">9,300円</span>
</div>
<div class="breakdown-row">
<span>燃料費調整額</span>
<span id="fuelResult">0円</span>
</div>
<div class="breakdown-row">
<span>再エネ賦課金</span>
<span id="renewableResult">0円</span>
</div>
<div class="breakdown-row total-row">
<span>合計</span>
<span id="sumResult">9,300円</span>
</div>
</div>
</div>

<div class="info">
<strong>計算について</strong><br>
基本料金＋電力量料金＋燃料費調整額＋再エネ賦課金で計算します。各単価は利用者が入力してください。実際の請求額は契約プラン、税金、その他の調整額などによって異なります。
</div>
</section>
</main>

<footer>
電気代かんたん計算｜無料シミュレーター
</footer>

<script>
function calculate() {
  const ids = ["basic","usage","price","fuel","renewable"];
  const values = {};

  for (const id of ids) {
    const text = document.getElementById(id).value.trim();
    const number = Number(text);

    if (text === "" || !Number.isFinite(number)) {
      showError("すべての項目に正しい数値を入力してください。");
      return;
    }
    values[id] = number;
  }

  if (values.basic < 0 || values.usage < 0 ||
      values.price < 0 || values.renewable < 0) {
    showError("基本料金、使用量、電力量料金、再エネ賦課金は0以上で入力してください。");
    return;
  }

  const basic = values.basic;
  const energy = values.usage * values.price;
  const fuel = values.usage * values.fuel;
  const renewable = values.usage * values.renewable;
  const total = basic + energy + fuel + renewable;

  const yen = n => Math.round(n).toLocaleString("ja-JP") + "円";

  document.getElementById("basicResult").textContent = yen(basic);
  document.getElementById("energyResult").textContent = yen(energy);
  document.getElementById("fuelResult").textContent = yen(fuel);
  document.getElementById("renewableResult").textContent = yen(renewable);
  document.getElementById("total").textContent = yen(total);
  document.getElementById("sumResult").textContent = yen(total);

  document.getElementById("error").hidden = true;
}

function showError(message) {
  const error = document.getElementById("error");
  error.textContent = message;
  error.hidden = false;
}
</script>

</body>
</html>
